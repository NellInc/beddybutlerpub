</style><body><script>if(new URLSearchParams(location.search).has("embed"))document.body.classList.add("embedded");</script><main><nav class="controls"><a href="./" style="color:#a8d9ff">All three avatars</a></nav><h1>Insistent: limb rig experiment</h1><div class="controls"><button id="play">Pause</button><label>Motion <input id="amount" type="range" min="0" max="1" step="0.01" value="1"></label><label>Pose <input id="phase" type="range" min="0" max="1" step="0.001" value="0"></label><label><input id="bones" type="checkbox" checked> Show joints</label><button id="rest">Rest pose</button></div><div class="views" style="max-width:650px;margin:0 auto 20px"><figure><figcaption>Original hand</figcaption><canvas id="hand-original" width="300" height="200"></canvas></figure><figure><figcaption>Finger articulation</figcaption><canvas id="hand-rig" width="300" height="200"></canvas></figure></div><div class="views"><figure><figcaption>Original artwork</figcaption><canvas id="original" width="960" height="1210"></canvas></figure><figure><figcaption>Articulated mesh</figcaption><canvas id="rig" width="960" height="1210"></canvas></figure></div><p>Local experiment. Original artwork unchanged. Flat-image skinning cannot reveal hidden artwork behind a moving limb.</p></main><script src="../../assets/avatar-rig/characters.js?v=site-1"></script><script src="../../assets/avatar-rig/mesh-renderer.js?v=site-1"></script><script src="../../assets/avatar-rig/rig.js?v=site-1"></script></html>
